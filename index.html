<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한성대 동아리 메타버스 3D</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--sub:#667085;--pri:#5b6cff;--bd:#e3e7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1c2030;--tx:#eef1fa;--sub:#9aa3b8;--bd:#2c3248}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:16px;margin:0 auto 0 0}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:7px 12px;cursor:pointer}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.chip{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:13px}
main{max-width:940px;margin:10px auto;padding:0 10px}
#wrap{position:relative}
#c{width:100%;height:68vh;min-height:360px;border-radius:14px;border:1px solid var(--bd);background:#dfe8ff;touch-action:none;display:block}
#pad{position:absolute;left:10px;bottom:10px;display:none;grid-template-columns:repeat(3,44px);gap:4px;touch-action:none}@media (pointer:coarse){#pad{display:grid}}#pad button{height:44px;padding:0;opacity:.85}
#mini{position:absolute;left:10px;bottom:10px;width:220px;height:161px;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 10px #0006;cursor:pointer;z-index:5;background:#c9e1bd}@media (pointer:coarse){#mini{bottom:140px;width:160px;height:117px}}
#fab{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}#fab button{padding:8px 12px;border-radius:20px;border:0;background:#000a;color:#fff;font-size:13px;cursor:pointer}#fab button:hover{background:#5b6cff}@media (pointer:coarse){#fab{bottom:140px}}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:#000b;color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;display:none;white-space:nowrap}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;flex-direction:column;gap:6px;z-index:30}
.t{background:#222;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;max-width:80vw}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#box{background:var(--card);border-radius:16px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:16px;position:relative}
#x{position:absolute;right:10px;top:10px;background:var(--bg);color:var(--tx);padding:4px 10px}
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff}
.poster{border-radius:12px;padding:26px;text-align:center;color:#fff;font-weight:700;font-size:20px;background-size:cover;background-position:center}
.poster span{font-size:54px;display:block}
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.log{background:var(--bg);border-radius:10px;padding:8px;height:170px;overflow:auto;font-size:14px}
.log p{margin:4px 0}
.row{display:flex;gap:6px;margin-top:6px}
.row input{flex:1;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card)}
video{width:100%;border-radius:10px;margin-top:8px}
li{margin:5px 0}
.sub{color:var(--sub);font-size:13px}
#gate{position:fixed;inset:0;z-index:25;background:linear-gradient(135deg,#2b3a67,#7a6aa8);display:none;align-items:center;justify-content:center;padding:16px}.gc{background:var(--card);border-radius:16px;padding:22px;width:min(460px,100%)}.gc .row input{min-width:0}
#vc{position:absolute;left:10px;top:10px;z-index:7;width:250px;background:#000c;color:#fff;border-radius:12px;padding:8px 10px;font-size:13px;display:none}#vc button{padding:4px 8px;font-size:12px}#vcl{max-height:90px;overflow:auto;margin:4px 0;font-size:12px}#vc .row input{padding:4px 6px;font-size:12px;min-width:0}
#wc{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:min(460px,calc(100% - 500px));min-width:290px;background:#000c;color:#fff;border-radius:12px;padding:6px 10px;z-index:6;font-size:13px}
#wc.closed #wcb{display:none}#wchd{cursor:pointer;display:flex;gap:6px;align-items:center}#wch{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#wcm{font-size:11px;opacity:.75;white-space:nowrap}#wcp{padding:3px 8px;font-size:12px}
#wcl{max-height:140px;overflow:auto;margin:5px 0;line-height:1.45}#wcl .sub{color:#cfd6ff}#wc .row input{min-width:0;flex:1;padding:6px 8px}#wc .row button{padding:6px 10px}
body.mob #wc{top:8px;bottom:auto;left:140px;right:104px;width:auto;min-width:0;transform:none;font-size:11px;padding:5px 8px}body.mob #wcm{display:none}
body.mob #wc:not(.closed){left:8px;right:8px;top:106px;z-index:8}
#mnb,#joy,#runb{display:none}
body.mob{overscroll-behavior:none}
body.mob header{flex-wrap:nowrap;padding:6px 8px;gap:6px;overflow:hidden}body.mob header h1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.mob header button.ghost,body.mob #st,body.mob #chn,body.mob #me{display:none}body.mob .chip{font-size:11px;padding:2px 7px;white-space:nowrap}body.mob #mnb{display:inline-block;padding:5px 11px;flex:none}
body.mob main{margin:0;padding:0;max-width:none}body.mob #c{height:calc(100dvh - var(--hh,46px));min-height:300px;border-radius:0;border:0}
body.mob #pad{display:none!important}
body.mob #mini{top:8px;left:8px;bottom:auto;width:124px;height:91px}
body.mob #fab{top:8px;right:8px;bottom:auto;gap:4px}body.mob #fab button{padding:5px 9px;font-size:11px}
body.mob #vc{top:106px;left:8px;width:210px;font-size:12px}
body.mob #joy{display:block;position:absolute;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:#0003;border:2px solid #fff9;touch-action:none;z-index:6}
#knob{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:#fffe;box-shadow:0 2px 6px #0005;pointer-events:none}
body.mob #runb{display:block;position:absolute;right:18px;bottom:34px;width:64px;height:64px;border-radius:50%;font-size:24px;z-index:6;background:#000a;touch-action:none}body.mob #runb.on{background:#5b6cff}
body.mob #hint{bottom:168px;font-size:14px;padding:10px 16px;background:#5b6cff;z-index:6;cursor:pointer;max-width:70vw;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<header>
  <button id="mnb" onclick="openMMenu()">☰</button>
  <h1>🎪 한성대 동아리 메타버스 3D</h1>
  <span class="chip" id="me"></span>
  <span class="chip" id="pt"></span>
  <span class="chip" id="st"></span><span class="chip" id="chn"></span>
  <button class="ghost" onclick="openStamp()">🏅 스탬프·뱃지</button>
  <button class="ghost" onclick="emote('wave')">👋</button><button class="ghost" onclick="emote('dance')">💃</button><button class="ghost" onclick="openReport()">🚩 신고</button><button class="ghost" onclick="openFeedback()">💬 피드백</button><button class="ghost" onclick="openMyRes()">📋 내 예약</button><button class="ghost" id="lt" onclick="toggleLite()">⚡</button><button class="ghost" onclick="ambient()">🎧</button>
  <button class="ghost" onclick="openCampusMap()">🗺 캠퍼스 안내도</button>
  <button class="ghost" onclick="openAdmin()">🛠 운영진</button><button class="ghost" onclick="logout()">🚪 나가기</button>
</header>
<main>
  <div id="wrap">
    <canvas id="c" width="900" height="560"></canvas>
    <div id="hint"></div>
    <div id="wc"><div id="wchd" onclick="chatToggle()"><span id="wch">💬 채팅</span><span id="wcm"></span><button id="wcp" onclick="event.stopPropagation();openPeople()">👥 접속자</button></div><div id="wcb"><div id="wcl"></div><div class="row"><input id="wci" maxlength="120" placeholder="이 공간 사람들에게 말하기 (Enter)" autocomplete="off" onkeydown="event.stopPropagation();if(event.key==='Enter')chatSend();if(event.key==='Escape')this.blur()" onkeyup="event.stopPropagation()"><button onclick="chatSend()">전송</button></div></div></div>
    <div id="joy"><div id="knob"></div></div><button id="runb" title="달리기">🏃</button>
    <div id="vc"><div id="vch"></div><div id="vcm"></div><div id="vcl"></div><div class="row"><input id="vci" placeholder="이 테이블 채팅" autocomplete="off" onkeydown="event.stopPropagation();if(event.key==='Enter')vcChat()" onkeyup="event.stopPropagation()"><button onclick="vcChat()">전송</button></div></div>
    <canvas id="mini" width="300" height="220" title="클릭하면 크게 · M 키로 켜기/끄기"></canvas>
    <div id="fab"><button onclick="openNotice()">📢 안내</button><button onclick="openFeedback()">💬 피드백</button><button onclick="openMyRes()">📋 내 예약</button><button onclick="openCampusMap()">🗺 지도</button></div>
    <div id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button><button data-k="shift" style="grid-column:1/4">🏃 달리기(누르고 있기)</button></div>
  </div>
  <p class="sub">이동: 화면을 한 번 클릭한 뒤 WASD/방향키(한글 입력 상태에서도 가능) · Shift 누르고 있으면 달리기 · 마우스 드래그로 시점 회전(좌우·상하) · 휠로 확대/축소 · 가까이에서 E 키 또는 클릭 · Q 인사 · R 춤 · 보라색 포털(🚪)로 맵 이동</p>
</main>
<div id="gate"></div>
<div id="err" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:60;background:#b42318;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px"></div>
<div id="toast"></div>
<div id="modal"><div id="box"><button id="x" onclick="closeM()">닫기</button><div id="mc"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  if(Math.hypot(JX,JY)>.15){ix=JX;iz=JY}
  if(ix||iz){const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
    me.tx=me.x+(fx*-iz-fz*ix)*20;me.ty=me.y+(fz*-iz+fx*ix)*20}else{me.tx=me.x;me.ty=me.y}

    if(me.x>o.x-m&&me.x<o.x+o.w+m&&me.y>o.y-m&&me.y<o.y+o.h+m){
      const l=me.x-(o.x-m),r=o.x+o.w+m-me.x,t=me.y-(o.y-m),b=o.y+o.h+m-me.y,mn=Math.min(l,r,t,b);
      if(mn===l)me.x=o.x-m;else if(mn===r)me.x=o.x+o.w+m;else if(mn===t)me.y=o.y-m;else me.y=o.y+o.h+m}});

    const a=Math.atan2(n.ty-n.y,n.tx-n.x);n.x+=Math.cos(a)*1;n.y+=Math.sin(a)*1;n.r=Math.atan2(Math.cos(a),Math.sin(a));

  BAV.forEach((a,i)=>anim(a,false,tn+i));

let AMB=null;
function ambient(){
  if(AMB){AMB.stop();AMB=null;toast('🔇 분위기 소리 끔');return}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const n=AC.sampleRate*2,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=.6;
    const g=AC.createGain();g.gain.value=.08;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.15;lg.gain.value=.03;lfo.connect(lg);lg.connect(g.gain);lfo.start();
    src.connect(f);f.connect(g);g.connect(AC.destination);src.start();
    AMB={stop(){try{src.stop();lfo.stop()}catch(e){}}};toast('🎧 박람회 분위기 소리 켬 (웅성웅성)')}
  catch(e){toast('이 브라우저는 소리를 지원하지 않아요')}}
